name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Compilar, probar y trazar requisitos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y probar
        run: mvn -B verify
      - name: Matriz de trazabilidad
        if: always()
        run: python3 herramientas/trazabilidad.py target/surefire-reports >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-de-pruebas
          path: target/surefire-reports

  ejecutable:
    name: Generar ejecutable de Windows
    needs: pruebas
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B package -DskipTests
      - name: jpackage
        run: jpackage --type app-image --name SimuladorSO --input target/libs --main-jar simulador-so.jar --main-class pe.uni.so.Lanzador --dest dist
      - uses: actions/upload-artifact@v4
        with:
          name: SimuladorSO-windows
          path: dist/SimuladorSO
